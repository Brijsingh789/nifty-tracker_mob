<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Nifty 50 Live Tracker (debug + full UI)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; text-align:center; padding:18px; transition: background-color 0.5s ease, color 0.3s ease; }
    .card { background: rgba(255,255,255,0.92); border-radius:8px; padding:18px; margin:12px auto; max-width:760px; box-shadow:0 6px 18px rgba(0,0,0,0.06); }
    h1 { font-size:48px; margin:6px 0; }
    label { display:block; text-align:left; margin:10px 0 4px; font-weight:600; }
    input[type="number"]{ width:100%; padding:8px 10px; font-size:16px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box; }
    button { padding:10px 14px; margin-right:8px; border-radius:8px; border:none; cursor:pointer; }
    #saveBtn{ background:#007bff; color:#fff } #resetBeepBtn{ background:#6c757d; color:#fff }
    .small{ font-size:14px; color:#333; margin-top:6px }
    .saved-values{ margin-top:10px; font-weight:700 }
    .error{ color:#b00020; font-weight:700 }
    #debugArea{ font-size:13px; color:#222; margin-top:8px; text-align:left; white-space:pre-wrap; max-height:120px; overflow:auto; background:#fafafa; border-radius:6px; padding:8px; border:1px dashed #eee; }
  </style>
</head>
<body style="background-color: #fff8bd; color: #111;">

  <div class="card">
    <h2>📈 Nifty 50 Current Value</h2>
    <h1 id="nifty">Loading...</h1>
    <div class="small">Last fetched: <span id="lastFetched">-</span></div>
  </div>

  <div class="card" aria-live="polite">
    <h2>Save Thresholds</h2>

    <label for="higher">Higher value (number)</label>
    <input id="higher" type="number" step="0.01" placeholder="Enter higher value">

    <label for="lower">Lower value (number)</label>
    <input id="lower" type="number" step="0.01" placeholder="Enter lower value">

    <div style="margin-top:12px;">
      <button id="saveBtn">💾 Save</button>
      <button id="resetBeepBtn">🔕 Reset Beep</button>
      <button id="forceFetch" style="background:#28a745;color:#fff">⟳ Fetch Now</button>
    </div>

    <div id="status" class="small"></div>
    <div class="saved-values" id="savedDisplay">No saved values yet.</div>
    <div id="saveTime" class="small"></div>
    <div id="beepStatus" class="small"></div>
    <div id="errorMsg" class="error"></div>

    <h4 style="margin-top:14px; text-align:left;">Debug Logs</h4>
    <div id="debugArea">Console & network logs will appear here (also check DevTools console).</div>
  </div>

<script>
/* FULL front-end: fetch + thresholds + beep + debug logging */

let savedHigh = null, savedLow = null;
let currentNifty = null;
let previousBg = 'yellow';
let beepDisabled = false;

// Tiny debug logger that prints to both Console and the debugArea UI.
function dbg(msg, obj) {
  const t = new Date().toLocaleTimeString();
  const full = `[${t}] ${msg}` + (obj !== undefined ? ' ' + JSON.stringify(obj) : '');
  console.log(full, obj !== undefined ? obj : '');
  const area = document.getElementById('debugArea');
  area.innerText = full + "\n\n" + area.innerText;
  // keep area reasonably small:
  if (area.innerText.length > 12000) area.innerText = area.innerText.slice(0, 10000);
}

// Beep function (~1 second)
function playBeep() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = 520;
    o.connect(g);
    g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.01);
    o.start();
    setTimeout(() => {
      try { g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05); } catch(e){}
      setTimeout(()=>{ try{ o.stop(); ctx.close(); } catch(e){} }, 60);
    }, 1000);
  } catch (e) { console.warn('Beep failed', e); }
}

function triggerBeepIfAllowed() {
  if (!beepDisabled) playBeep();
}

// Update background color based on thresholds and current value
function updateBackground() {
  let bg = '#fff8bd'; // default pale yellow
  let color = '#111';

  if (Number.isFinite(currentNifty) && Number.isFinite(savedHigh) && Number.isFinite(savedLow)) {
    if (currentNifty > savedHigh) { bg = '#1a8a3a'; color = '#fff'; } // green
    else if (currentNifty < savedLow) { bg = '#c9302c'; color = '#fff'; } // red
    else { bg = '#fff8bd'; color = '#111'; } // yellow-ish
  } else {
    bg = '#fff8bd'; color = '#111';
  }

  // beep when we go from yellow (neutral) to green or red
  const wasYellow = (previousBg === 'yellow' || previousBg === '#fff8bd' || previousBg === undefined);
  if (wasYellow && (bg === '#1a8a3a' || bg === '#c9302c')) {
    dbg('Transition: yellow -> ' + (bg === '#1a8a3a' ? 'green' : 'red') + ' ; beepAllowed=' + (!beepDisabled));
    triggerBeepIfAllowed();
  }

  document.body.style.backgroundColor = bg;
  document.body.style.color = color;
  // set readable previousBg marker
  previousBg = (bg === '#fff8bd' ? 'yellow' : (bg === '#1a8a3a' ? 'green' : 'red'));
  updateBeepStatusUI();
}

// Persisted load/save
function loadSaved() {
  try {
    const sh = localStorage.getItem('nifty_saved_high');
    const sl = localStorage.getItem('nifty_saved_low');
    const st = localStorage.getItem('nifty_saved_time');
    const sb = localStorage.getItem('nifty_beep_disabled');

    if (sh !== null && sl !== null) {
      savedHigh = Number(sh);
      savedLow = Number(sl);
      document.getElementById('savedDisplay').innerText = `Saved — Higher: ${savedHigh} , Lower: ${savedLow}`;
      if (st) document.getElementById('saveTime').innerText = `Saved at: ${st}`;
      document.getElementById('status').innerText = 'Values loaded from previous session.';
    } else {
      document.getElementById('savedDisplay').innerText = 'No saved values yet.';
    }
    beepDisabled = (sb === 'true');
  } catch (e) {
    dbg('loadSaved error', String(e));
  }
  updateBeepStatusUI();
  updateBackground();
}

// Update beep status text
function updateBeepStatusUI() {
  document.getElementById('beepStatus').innerText = beepDisabled ? 'Beep: OFF (until you save thresholds)' : 'Beep: ON';
}

// Fetch nifty from server (cache-busting)
async function fetchNiftyOnce() {
  const url = '/nifty?cb=' + Date.now();
  dbg('Fetching ' + url);
  try {
    const res = await fetch(url, { cache: 'no-store' });
    dbg('Received response status: ' + res.status);
    const txt = await res.text();
    // show short raw response in debug (avoid huge logs)
    dbg('Raw response (first 500 chars): ' + txt.slice(0, 500));
    let data;
    try {
      data = JSON.parse(txt);
    } catch (e) {
      dbg('JSON parse error: ' + String(e));
      document.getElementById('errorMsg').innerText = 'Server returned non-JSON (check console/network).';
      console.error('Non-JSON response:', txt);
      return;
    }

    dbg('Parsed JSON: ' + JSON.stringify(data));
    if (data && data.nifty !== undefined) {
      currentNifty = Number(data.nifty);
      if (!Number.isFinite(currentNifty)) currentNifty = null;
      document.getElementById('nifty').innerText = (currentNifty !== null) ? currentNifty : '—';
      document.getElementById('lastFetched').innerText = new Date().toLocaleTimeString();
      document.getElementById('errorMsg').innerText = '';
      // immediately update visuals
      updateBackground();
    } else if (data && data.error) {
      document.getElementById('errorMsg').innerText = 'Server error: ' + (data.error || JSON.stringify(data));
      dbg('Server reported error payload', data);
    } else {
      document.getElementById('errorMsg').innerText = 'Unexpected server response shape.';
      dbg('Unexpected shape', data);
    }
  } catch (err) {
    dbg('Fetch failed: ' + String(err));
    document.getElementById('errorMsg').innerText = 'Fetch failed (see console).';
  }
}

// Save button handler
document.getElementById('saveBtn').addEventListener('click', () => {
  document.getElementById('errorMsg').innerText = '';
  const hiRaw = document.getElementById('higher').value;
  const loRaw = document.getElementById('lower').value;
  const h = Number(hiRaw);
  const l = Number(loRaw);
  if (!Number.isFinite(h) || !Number.isFinite(l)) {
    document.getElementById('errorMsg').innerText = 'Please enter valid numbers.';
    return;
  }
  if (h <= l) {
    document.getElementById('errorMsg').innerText = 'Higher must be greater than Lower.';
    return;
  }
  savedHigh = h; savedLow = l;
  beepDisabled = false; // enabling beep on save
  const now = new Date().toLocaleString();
  try {
    localStorage.setItem('nifty_saved_high', String(savedHigh));
    localStorage.setItem('nifty_saved_low', String(savedLow));
    localStorage.setItem('nifty_saved_time', now);
    localStorage.setItem('nifty_beep_disabled', String(beepDisabled));
  } catch (e) {
    dbg('Could not persist to localStorage', String(e));
  }
  document.getElementById('savedDisplay').innerText = `Saved — Higher: ${savedHigh} , Lower: ${savedLow}`;
  document.getElementById('saveTime').innerText = `Saved at: ${now}`;
  document.getElementById('status').innerText = 'Values saved. Beep enabled.';
  dbg('Saved thresholds', { savedHigh, savedLow });
  updateBackground();
});

// Reset beep handler
document.getElementById('resetBeepBtn').addEventListener('click', () => {
  beepDisabled = true;
  try { localStorage.setItem('nifty_beep_disabled', 'true'); } catch (e) {}
  document.getElementById('status').innerText = 'Beep turned OFF until next save.';
  updateBeepStatusUI();
  dbg('Beep disabled by user');
});

// Force fetch button
document.getElementById('forceFetch').addEventListener('click', () => {
  fetchNiftyOnce();
});

// Init
loadSaved();

// Poll every 5 seconds (server caches for 5s by default too)
setInterval(fetchNiftyOnce, 5000);
// initial fetch
fetchNiftyOnce();

// Helpful note about service workers (old cache can cause stale UI)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    if (regs && regs.length) dbg('Service workers registered (if old page persists, unregister via DevTools Application tab).', regs.map(r=>r.scope));
    else dbg('No service workers registered.');
  }).catch(e => dbg('Service worker check failed', String(e)));
}

</script>
</body>
</html>
